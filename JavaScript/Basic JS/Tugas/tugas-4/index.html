<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Format Nomor Induk Pegawai</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <table border="1" cellpadding="10" cellspacing="0">
        <thead>
          <tr>
            <th>Nama</th>
            <th>Tanggal Lahir</th>
            <th>Tanggal ASN</th>
            <th>Jenis Kelamin</th>
            <th>No Urut</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td id="nama">nama</td>
            <td id="lahir">tanggal lahir</td>
            <td id="asn">tanggal asn</td>
            <td id="kelamin">jenis kelamin</td>
            <td id="urut">no urut</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
